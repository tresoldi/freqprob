[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freqprob"
dynamic = ["version"]
description = "A Python library for scoring observation probabilities from frequency counts, with multiple smoothing methods."
readme = "README.md"
license = "MIT"
keywords = ["nlp", "smoothing", "frequency", "probability", "language-model"]
authors = [
    {name = "Tiago Tresoldi", email = "freqprob@tresoldi.org"},
]
maintainers = [
    {name = "Tiago Tresoldi", email = "freqprob@tresoldi.org"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
# Memory profiling capabilities
memory = [
    "psutil>=5.8.0",
]
# Testing dependencies (lightweight; used by the CI test matrix)
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "hypothesis>=6.0.0",
    "nltk>=3.8",
    "scikit-learn>=1.0.0",
]
# Documentation site (MkDocs + mkdocstrings)
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
# All optional dependencies (runtime + development)
all = [
    "freqprob[memory,dev,docs]",
]
# Development dependencies
dev = [
    # Testing (required by Makefile and tests/)
    "freqprob[test]",

    # Code quality (required by Makefile).
    # ruff/mypy pinned exactly so local, CI, and pre-commit run identical linter
    # versions (unpinned ruff/mypy drift silently changes check results).
    "ruff==0.16.1",
    "mypy==2.3.0",
    "bandit[toml]>=1.7.0",

    # Bound the stub-bearing scientific deps for the type-check (quality) job,
    # which installs `.[dev]`. A new numpy/scipy release can otherwise change
    # mypy's view of third-party stubs and break the type check with no code
    # change (as numpy 2.5's PEP 695 stubs did). The runtime dependency (core
    # `dependencies`) and the `test` matrix stay unpinned to surface real
    # regressions against the latest versions. Bump these deliberately.
    "numpy<2.6",
    "scipy<1.19",

    # Build and release (required by Makefile)
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/tresoldi/freqprob"
Documentation = "https://tresoldi.github.io/freqprob/"
Repository = "https://github.com/tresoldi/freqprob.git"
Issues = "https://github.com/tresoldi/freqprob/issues"
Changelog = "https://github.com/tresoldi/freqprob/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "freqprob.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["freqprob*"]



# Ruff linting (replaces flake8, pycodestyle, pyflakes, etc.)
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking
    "RUF",   # Ruff-specific rules
    "D",     # pydocstyle
]

ignore = [
    "E501",   # Line too long (ruff format handles this)
    "B008",   # Do not perform function calls in argument defaults
    "RET504", # Unnecessary variable assignment before return
    "ARG002", # Unused method argument (common in abstract methods)
    "D202",   # No blank lines allowed after function docstring
    "D200",   # One-line docstring should fit on one line
    "D107",   # Missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",  # Unused function arguments in tests
    "ARG002",  # Unused method arguments in tests
    "S101",    # Use of assert detected (pytest uses assert)
]
"scripts/benchmarks.py" = [
    "T201",    # Allow print statements in benchmark script
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "C901",    # Complex function
]
"docs/tutorial_*.py" = [
    "D100",   # Missing module docstring (Nhandu files are self-documenting)
    "E402",   # Module level import not at top (pedagogical import placement)
    "RUF003", # Ambiguous Greek characters (mathematical notation)
    "T201",   # Allow print statements in tutorials
]
"src/freqprob/performance/profiling.py" = [
    "T201",   # Allow print statements for monitoring alerts
]
"docs/*.ipynb" = [
    "E402",    # Module level import not at top of file (common in notebooks)
    "T201",    # Allow print statements in notebooks
]
"docs/archive/*.ipynb" = [
    "E402",    # Module level import not at top of file (common in notebooks)
    "T201",    # Allow print statements in notebooks
]
"tests/test_efficiency.py" = [
    "T201",    # Allow print statements for manual inspection
]

[tool.ruff.lint.isort]
known-first-party = ["freqprob"]
known-third-party = ["numpy", "scipy", "psutil", "pytest"]

[tool.ruff.lint.pydocstyle]
convention = "google"  # Keep existing convention; full Epytext migration requires extensive refactoring

# MyPy type checking
[tool.mypy]
# Target 3.12 so mypy can parse modern dependency stubs (e.g. numpy's PEP 695
# `type` statements). Our 3.10 syntax compatibility is enforced by ruff
# (target-version = "py310") and validated by the 3.10 CI test matrix leg.
python_version = "3.12"
files = ["src/freqprob", "tests", "scripts"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # Some third-party decorators are untyped
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "scipy.*",
    "psutil.*",
    "pytest.*",
    "nltk.*",
    "sklearn.*",
    "hypothesis.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["misc", "no-untyped-def", "method-assign"]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=freqprob",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=88",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "memory: marks tests that check memory usage",
    "numerical: marks numerical stability tests",
    "statistical: marks statistical correctness tests",
    "regression: marks regression tests against reference implementations",
    "property: marks property-based tests with hypothesis",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["freqprob"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",  # Usually just imports
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "tests/htmlcov"

[tool.coverage.xml]
output = "coverage.xml"


# Bandit security configuration
[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101", "B601", "B403", "B301", "B404", "B603", "B110", "B311"]  # Skip assert_used, shell_injection_process_vulnerable, pickle usage, pickle loads, subprocess_import, subprocess_without_shell, try_except_pass, and random

[tool.bandit.assert_used]
skips = ["*_test.py", "*/test_*.py"]

